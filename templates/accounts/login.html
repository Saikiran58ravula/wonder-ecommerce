{% extends 'base.html' %}

{% block title %}Login - Wonder{% endblock %}

{% block content %}
<h1>Login to Wonder</h1>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-field">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="form-error">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn-primary">Login</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{% url 'accounts:register' %}"><strong>Register here</strong></a></p>
</div>
{% endblock %}
