{% extends 'base.html' %}

{% block title %}Login - Wonder{% endblock %}

{% block content %}
<h1>Login to Wonder</h1>

<form method="post" style="max-width: 400px;">
    {% csrf_token %}
    {% for field in form %}
        <div style="margin-bottom: 15px;">
            <label>{{ field.label }}</label><br>
            {{ field }}
            {% if field.errors %}
                <p style="color: red; font-size: 13px;">{{ field.errors }}</p>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit">Login</button>
</form>

<p>Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a></p>
{% endblock %}
